# Native iOS ECR SDK. Same idea as android/gradle.properties.
#
#   project   — sibling AmwalECR-iOS-CocoaPods (example Podfile :path)
#   cocoapods — published AmwalECR from CocoaPods trunk
#   spm       — sibling AmwalECR-iOS-SPM, recorded for an Xcode package reference
#
# Paths are relative to this file (ios/).
# The example overrides them in example/ios/ecr_sdk.properties.
ecrSdkDependency=cocoapods
ecrSdkVersion=0.3.0
ecrSdkCocoaPodsRoot=../../AmwalECR-iOS-CocoaPods
ecrSdkSpmRoot=../../AmwalECR-iOS-SPM
