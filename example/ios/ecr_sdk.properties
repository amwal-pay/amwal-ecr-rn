# Example overrides for ios/ecr_sdk.properties.
# Paths are relative to this file (example/ios/).
#
#   project   — local AmwalECR-iOS-CocoaPods via the Podfile
#   cocoapods — CocoaPods trunk (RNAmwalEcr.podspec range)
#   spm       — local AmwalECR-iOS-SPM path, for an Xcode Swift package
ecrSdkDependency=project
ecrSdkVersion=0.2.2
ecrSdkCocoaPodsRoot=../../../AmwalECR-iOS-CocoaPods
ecrSdkSpmRoot=../../../AmwalECR-iOS-SPM
