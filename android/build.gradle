buildscript {
  ext.AmwalEcr = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return AmwalEcr[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.amwalecr"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

// The app's android/gradle.properties wins over this library's file.
//   1. -PecrSdkDependency= on the Gradle command
//   2. the app's android/gradle.properties
//   3. this library's android/gradle.properties
def ecrSdkValue = { String key, String fallback ->
    def fromCommand = gradle.startParameter.projectProperties.get(key)
    if (fromCommand != null && !fromCommand.toString().trim().isEmpty()) {
        return fromCommand.toString().trim()
    }
    def appFile = rootProject.file("gradle.properties")
    if (rootProject != project && appFile.exists()) {
        def appProps = new Properties()
        appFile.withInputStream { appProps.load(it) }
        def fromApp = appProps.getProperty(key)
        if (fromApp != null && !fromApp.trim().isEmpty()) {
            return fromApp.trim()
        }
    }
    def fromLibrary = findProperty(key)
    return (fromLibrary != null ? fromLibrary.toString() : fallback).trim()
}

def ecrSdkDependency = ecrSdkValue("ecrSdkDependency", "maven")
def ecrSdkVersion = ecrSdkValue("ecrSdkVersion", "1.0.11")
def ecrSdkJarPath = ecrSdkValue(
        "ecrSdkJarPath",
        "../../ECR-simulator/ecr-sdk/build/libs/ecr-sdk-${ecrSdkVersion}.jar")

repositories {
  google()
  mavenCentral()
  mavenLocal()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

  switch (ecrSdkDependency) {
    case "maven":
      println "[react-native-amwal-ecr] Using ECR SDK from Maven: com.amwal-pay:ecr-sdk:${ecrSdkVersion}"
      implementation "com.amwal-pay:ecr-sdk:${ecrSdkVersion}"
      break
    case "jar":
      def jarFile = file(ecrSdkJarPath)
      if (!jarFile.exists()) {
        throw new GradleException(
                "ecr-sdk JAR not found at ${jarFile.absolutePath}. " +
                        "Run './gradlew :ecr-sdk:jar' in the ECR-simulator checkout first.")
      }
      println "[react-native-amwal-ecr] Using ECR SDK from JAR: ${jarFile.absolutePath}"
      implementation files(jarFile)
      implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
      implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
      break
    case "project":
      println "[react-native-amwal-ecr] Using ECR SDK from project module :ecr-sdk"
      implementation project(":ecr-sdk")
      break
    default:
      throw new GradleException(
              "Unknown ecrSdkDependency='${ecrSdkDependency}'. Use: project | jar | maven")
  }
}
