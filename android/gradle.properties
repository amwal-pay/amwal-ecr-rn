# Native Android ECR SDK, the same switch as amwal-ecr-flutter.
#   maven   — com.amwal-pay:ecr-sdk from Maven Central (published consumers)
#   project — sibling :ecr-sdk Gradle module (example/android/settings.gradle includes it)
#   jar     — pre-built JAR from the ECR-simulator checkout
#
# Local project workflow (example app):
#   ecrSdkDependency=project
#   ecrSdkRoot=../../../ECR-simulator
ecrSdkDependency=maven
ecrSdkVersion=1.0.6
# ecrSdkRoot=../../ECR-simulator
# ecrSdkJarPath=../../ECR-simulator/ecr-sdk/build/libs/ecr-sdk-1.0.6.jar
android.useAndroidX=true
