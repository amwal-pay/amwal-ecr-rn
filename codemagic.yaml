# Codemagic for react-native-amwal-ecr, the React Native bridge over the
# published Amwal ECR providers (com.amwal-pay:ecr-sdk on Maven Central,
# AmwalECR on CocoaPods trunk).
#
# Four workflows:
#
#   rn-verify                 every push and pull request — TypeScript, lint,
#                             tests with coverage, the package build and
#                             archive, codegen, the Android example (which
#                             compiles the Kotlin bridge against Maven Central)
#                             and the iOS example for the simulator (which
#                             compiles the Swift bridge against trunk).
#
#   npm-publish               a `vX.Y.Z` tag — refuses unless the tag,
#                             package.json and the top CHANGELOG entry agree and
#                             the exact native providers this bridge pins are
#                             live on their registries; skips a version already
#                             on npm; publishes; reads the version back.
#
#   example-ios-testflight    a `example-ios-*` tag or a manual start — builds
#                             the example signed for the App Store and submits
#                             it to TestFlight so the founder can install it.
#
#   example-android-firebase  a `example-android-*` tag or a manual start —
#                             builds the example release APK and hands it to
#                             Firebase App Distribution.
#
# Credentials, all Codemagic environment groups, never in the repository:
#   npm_credentials  NPM_TOKEN — an npm granular access token with publish
#                    rights on react-native-amwal-ecr.
#   A                FIREBASE_SERVICE_ACCOUNT (the Firebase project's service
#                    account JSON) and FIREBASE_ANDROID_APP_ID (the Android app
#                    registered in Firebase for com.amwalpay.amwal_ecr_rn_example).
# The App Store Connect integration named "Amwal CodeMagic" supplies the API
# key for automatic signing and for TestFlight.
definitions:
  env: &env
    node: 22.15.0
    java: 17
    xcode: latest
    cocoapods: default
  install: &install
    name: Install dependencies
    script: |
      set -euo pipefail
      corepack enable
      yarn install --immutable
  js_checks: &js_checks
    name: TypeScript, lint, tests, package and codegen
    script: |
      set -euo pipefail
      yarn lint
      yarn typecheck
      yarn test:ci --no-watchman
      yarn prepare
      npm pack --dry-run
      codegen_out="$(mktemp -d /tmp/amwal-ecr-codegen.XXXXXX)"
      node node_modules/react-native/scripts/generate-codegen-artifacts.js \
        -p . -t all -o "$codegen_out" -s library
  android_example: &android_example
    name: Android example (compiles the Kotlin bridge against Maven Central)
    script: |
      set -euo pipefail
      cd example/android
      chmod +x gradlew
      # :app depends on :react-native-amwal-ecr, so this is the bridge's
      # compile check against the pinned com.amwal-pay:ecr-sdk as well.
      ./gradlew :app:assembleDebug \
        --no-daemon --console=plain \
        -PreactNativeArchitectures=arm64-v8a
  ios_pods: &ios_pods
    name: Resolve pods (AmwalECR from trunk)
    script: |
      set -euo pipefail
      cd example/ios
      pod install --repo-update
      grep -A2 'AmwalECR' Podfile.lock | head -5
  ios_simulator: &ios_simulator
    name: iOS example for the simulator, without signing
    script: |
      set -euo pipefail
      cd example/ios
      xcodebuild \
        -workspace AmwalEcrExample.xcworkspace \
        -scheme AmwalEcrExample \
        -configuration Debug \
        -sdk iphonesimulator \
        -destination 'generic/platform=iOS Simulator' \
        CODE_SIGNING_ALLOWED=NO \
        build
  email: &email
    email:
      recipients:
        - amr.elskaan@amwal-pay.com
      notify:
        success: true
        failure: true

workflows:
  rn-verify:
    name: react-native-amwal-ecr — verify (JS, Android, iOS)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: *env
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - *install
      - *js_checks
      - *android_example
      - *ios_pods
      - *ios_simulator
    artifacts:
      - coverage/**
      - example/android/app/build/outputs/**/*.apk
      - example/ios/Podfile.lock
      - /tmp/xcodebuild_logs/*.log
    publishing: *email

  npm-publish:
    name: react-native-amwal-ecr — publish to npm (vX.Y.Z tag)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *env
      groups:
        - npm_credentials
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - *install
      - name: Tag, package and changelog agree
        script: |
          set -euo pipefail
          tag="${CM_TAG:-}"
          [[ -n "$tag" ]] || { echo "Not a tag build (CM_TAG is empty)"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          changelog_version="$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "tag=$tag package=$version changelog=$changelog_version"
          if [[ "${tag#v}" != "$version" || "$version" != "$changelog_version" ]]; then
            echo "Tag, package.json and the top CHANGELOG entry must name the same version." >&2
            echo "Tags are never moved: fix the files and release the next version." >&2
            exit 1
          fi
          echo "$version" > "$CM_BUILD_DIR/.release-version"
      - name: The native providers this bridge pins are live
        script: |
          set -euo pipefail
          # android/build.gradle: implementation "com.amwal-pay:ecr-sdk:X.Y.Z"
          sdk="$(sed -nE 's/.*"com\.amwal-pay:ecr-sdk:([0-9.]+)".*/\1/p' android/build.gradle | head -1)"
          [[ -n "$sdk" ]] || { echo "Could not read the ecr-sdk version from android/build.gradle" >&2; exit 1; }
          curl -fsSI "https://repo1.maven.org/maven2/com/amwal-pay/ecr-sdk/${sdk}/ecr-sdk-${sdk}.pom" >/dev/null \
            && echo "com.amwal-pay:ecr-sdk:${sdk} is on Maven Central" \
            || { echo "com.amwal-pay:ecr-sdk:${sdk} is not on Maven Central; release the Android provider first." >&2; exit 1; }
          # RNAmwalEcr.podspec: s.dependency "AmwalECR", "~> X.Y.Z"
          wanted="$(sed -nE 's/.*s\.dependency[[:space:]]+"AmwalECR",[[:space:]]*"~>[[:space:]]*([0-9.]+)".*/\1/p' RNAmwalEcr.podspec | head -1)"
          [[ -n "$wanted" ]] || { echo "Could not read the AmwalECR range from RNAmwalEcr.podspec" >&2; exit 1; }
          curl -fsS https://trunk.cocoapods.org/api/v1/pods/AmwalECR | python3 -c '
          import json, sys
          wanted = tuple(int(p) for p in sys.argv[1].split("."))
          have = [tuple(int(p) for p in v["name"].split(".")) for v in json.load(sys.stdin).get("versions", []) if v["name"].replace(".", "").isdigit()]
          # ~> X.Y.Z : >= X.Y.Z and < X.(Y+1)
          ok = [v for v in have if v >= wanted and v[:2] == wanted[:2]]
          print("AmwalECR on trunk satisfying ~> %s: %s" % (sys.argv[1], [".".join(map(str, v)) for v in ok]))
          sys.exit(0 if ok else 1)
          ' "$wanted" || { echo "No AmwalECR version satisfying ~> $wanted is on CocoaPods trunk; release the iOS provider first." >&2; exit 1; }
      - *js_checks
      - *android_example
      - *ios_pods
      - *ios_simulator
      - name: Skip an already published immutable version
        script: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(cat "$CM_BUILD_DIR/.release-version")"
          if npm view "$name@$version" version 2>/dev/null | grep -qx "$version"; then
            echo "$name@$version is already on npm — nothing to publish."
            touch "$CM_BUILD_DIR/.already-published"
          else
            echo "$name@$version is not on npm yet — will publish."
          fi
      - name: npm credentials
        script: |
          set -euo pipefail
          [[ -f "$CM_BUILD_DIR/.already-published" ]] && { echo "skipped"; exit 0; }
          [[ -n "${NPM_TOKEN:-}" ]] || {
            echo "NPM_TOKEN is missing from the npm_credentials environment group." >&2
            exit 1
          }
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          chmod 0600 "$HOME/.npmrc"
          npm whoami
      - name: Publish to npm
        script: |
          set -euo pipefail
          [[ -f "$CM_BUILD_DIR/.already-published" ]] && { echo "skipped"; exit 0; }
          npm publish --access public
      - name: Read the release back from npm
        script: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(cat "$CM_BUILD_DIR/.release-version")"
          for attempt in $(seq 1 30); do
            if npm view "$name@$version" version 2>/dev/null | grep -qx "$version"; then
              echo "$name@$version is resolvable from npm."
              exit 0
            fi
            echo "Not visible yet ($attempt/30), waiting…"
            sleep 10
          done
          echo "$name@$version did not appear on npm within five minutes." >&2
          exit 1
    artifacts:
      - coverage/**
      - example/android/app/build/outputs/**/*.apk
    publishing: *email

  example-ios-testflight:
    name: Amwal ECR RN Example — TestFlight (example-ios-* tag or manual)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Amwal CodeMagic
    environment:
      <<: *env
      # Script signing, not the automatic `ios_signing:` form: that form only
      # fetches profiles already uploaded to Codemagic, and there are none for
      # this bundle. The `ios_signing` group holds CERTIFICATE_PRIVATE_KEY, the
      # same key the Flutter example signs with; fetch-signing-files creates
      # the profile through the App Store Connect integration on first use.
      # The app record must exist in App Store Connect before the first
      # submission.
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: com.amwalpay.amwalEcrRnExample
        XCODE_WORKSPACE: AmwalEcrExample.xcworkspace
        XCODE_SCHEME: AmwalEcrExample
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'example-ios-*'
          include: true
    scripts:
      - *install
      - *ios_pods
      - name: Build number
        script: |
          set -euo pipefail
          cd example/ios
          # One monotonically increasing build number per Codemagic build, so
          # TestFlight never rejects a duplicate.
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Set up a keychain for signing
        script: |
          keychain initialize
      - name: Fetch or create the App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add the certificate to the keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          set -euo pipefail
          cd example/ios
          xcode-project use-profiles
      - name: Build IPA for App Store distribution
        script: |
          set -euo pipefail
          cd example/ios
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - example/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      <<: *email
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Testers
        submit_to_app_store: false

  example-android-firebase:
    name: Amwal ECR RN Example — Firebase App Distribution (example-android-* tag or manual)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *env
      groups:
        - A
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'example-android-*'
          include: true
    scripts:
      - *install
      - name: Build the example release APK
        script: |
          set -euo pipefail
          cd example/android
          chmod +x gradlew
          # The release build type is signed with the checked-in debug keystore
          # (the React Native template default). App Distribution accepts that;
          # a store listing would need a real upload keystore.
          ./gradlew :app:assembleRelease \
            --no-daemon --console=plain \
            -PversionCode="$PROJECT_BUILD_NUMBER"
          ls -la app/build/outputs/apk/release/
      - name: Upload to Firebase App Distribution
        script: |
          set -euo pipefail
          # A script with the Firebase CLI, not a `publishing: firebase:`
          # block: Codemagic validates the variables a publishing block names
          # when it loads this file, and while FIREBASE_SERVICE_ACCOUNT is not
          # yet defined that validation error rejects EVERY webhook-started
          # build of EVERY workflow here. A script only needs them when it runs.
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT:-}" || -z "${FIREBASE_ANDROID_APP_ID:-}" ]]; then
            echo "Set FIREBASE_SERVICE_ACCOUNT (secure: the service-account JSON, or its base64) and" >&2
            echo "FIREBASE_ANDROID_APP_ID (the Firebase Android app id for com.amwalpay.amwal_ecr_rn_example) in group A." >&2
            exit 1
          fi
          creds="$CM_BUILD_DIR/.firebase-sa.json"
          if printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds"
          else
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > "$creds"
          fi
          chmod 600 "$creds"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds"
          command -v firebase >/dev/null 2>&1 || npm install -g firebase-tools
          apk="$(ls example/android/app/build/outputs/apk/release/*.apk | head -1)"
          firebase appdistribution:distribute "$apk" \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups tester \
            --release-notes "Build $PROJECT_BUILD_NUMBER from ${CM_TAG:-${CM_BRANCH:-manual}} (${CM_COMMIT:0:8})"
          rm -f "$creds"
    artifacts:
      - example/android/app/build/outputs/**/*.apk
    publishing: *email
